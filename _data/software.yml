  description: Step-by-step 3D illustrations of chemical abrasion and ion-exchange column chemistry, with simulated element bands for U–Pb anion columns, resin partitioning curves, and a protocol atlas across isotope systems.
  detail: JavaScript · three.js · Clean-lab chemistry

- name: Bonneville Shoreline 3D
