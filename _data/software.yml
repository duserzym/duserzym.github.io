- name: TIMS 3D
  icon: /assets/img/software/tims-3d.svg
  url: https://duserzym.github.io/tims-3d/
  category: Teaching resources
  label: Mass spectrometry
  description: Explodable, physics-based 3D models of thermal ionization mass spectrometers (Isotopx Phoenix, Nu TIMS, Thermo Triton XT), with traced ion optics, Faraday Johnson noise, Daly vs ion counter, source tuning, filament setups and total evaporation.
