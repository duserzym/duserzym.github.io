<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Sun Compass 3D icon</title>
  <desc id="desc">The sun on its daily arc above a sun-compass dial; a vertical pin casts a shadow away from the sun, and an orange shadow-angle arc runs from the shadow to the blue sample reference arrow.</desc>
  <defs>
