      <stop stop-color="#55606f"/><stop offset="1" stop-color="#2f3742"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f7f8fa"/><stop offset="1" stop-color="#dfe4ec"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#fff6d6"/><stop offset="0.38" stop-color="#ffc83d"/><stop offset="1" stop-color="#ff9f1c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0f1b2d" flood-opacity="0.25"/>
    </filter>
  </defs>
