<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Rock Magnetometry 3D icon</title>
  <desc id="desc">An oriented rock core sits inside the copper pickup coil of a SQUID magnetometer; its remanent magnetization glows as a vector, wrapped in dipole field lines.</desc>
  <defs>
    <linearGradient id="tile" x2="0.8" y2="1">
      <stop stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef5"/>
    </linearGradient>
    <linearGradient id="iron" x2="1" y2="1">
      <stop stop-color="#55606f"/><stop offset="1" stop-color="#2f3742"/>
    </linearGradient>
    <linearGradient id="rock" x2="1">
      <stop stop-color="#6b3a2c"/><stop offset="0.35" stop-color="#9a5741"/><stop offset="0.7" stop-color="#7a4232"/><stop offset="1" stop-color="#4f2a20"/>
    </linearGradient>
    <linearGradient id="face" x2="0.6" y2="1">
      <stop stop-color="#d79a7c"/><stop offset="1" stop-color="#b06a50"/>
    </linearGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#fff6d6"/><stop offset="0.35" stop-color="#ffc35a"/><stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#0f1b2d" flood-opacity="0.25"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="36" y="36" width="440" height="440" rx="88" fill="url(#tile)"/>
  <rect x="36" y="36" width="440" height="440" rx="88" fill="none" stroke="#d9e1ec" stroke-width="10"/>

  <!-- dipole field lines, aligned with the magnetization -->
  <g fill="none" stroke-linecap="round" stroke-width="6" transform="rotate(28 256 262)">
    <path d="M256,150 C196,92 92,150 92,262 C92,374 196,432 256,374" stroke="#3b82f6" stroke-opacity="0.85"/>
    <path d="M256,150 C316,92 420,150 420,262 C420,374 316,432 256,374" stroke="#3b82f6" stroke-opacity="0.85"/>
    <path d="M256,176 C222,138 150,172 150,262 C150,352 222,386 256,348" stroke="#10b981" stroke-opacity="0.8"/>
    <path d="M256,176 C290,138 362,172 362,262 C362,352 290,386 256,348" stroke="#10b981" stroke-opacity="0.8"/>
  </g>

  <g filter="url(#shadow)">
    <!-- sample stage -->
    <rect x="150" y="380" width="212" height="40" rx="12" fill="url(#iron)"/>
    <rect x="198" y="364" width="116" height="24" rx="7" fill="#2f3742"/>
    <!-- back half of the copper pickup coil -->
    <g fill="none" stroke="#a9643a" stroke-width="9">
      <path d="M176,262 A80,22 0 0 1 336,262"/>
      <path d="M176,310 A80,22 0 0 1 336,310"/>
    </g>
    <!-- rock core -->
    <path d="M200,212 L200,352 A56,17 0 0 0 312,352 L312,212 Z" fill="url(#rock)"/>
    <ellipse cx="256" cy="212" rx="56" ry="17" fill="url(#face)"/>
    <path d="M232,214 L280,210" stroke="#fff3e8" stroke-width="4" stroke-linecap="round"/>
    <!-- front half of the coil -->
    <g fill="none" stroke="#c7783f" stroke-width="10" stroke-linecap="round">
      <path d="M176,262 A80,22 0 0 0 336,262"/>
      <path d="M176,310 A80,22 0 0 0 336,310"/>
    </g>
  </g>

  <!-- remanent magnetization vector -->
  <g stroke-linecap="round" fill="none">
    <path d="M256,280 L342,118" stroke="#ffb547" stroke-width="16" stroke-opacity="0.75" filter="url(#glow)"/>
    <path d="M256,280 L336,130" stroke="#e8792b" stroke-width="8"/>
  </g>
  <path d="M352,99 L349,142 L317,126 Z" fill="#e8792b" stroke="#e8792b" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="256" cy="280" r="30" fill="url(#hot)"/>
</svg>
