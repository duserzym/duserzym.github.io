  <!-- Zircon: Pupin S8 habit projected from the STL models of https://github.com/duserzym/mineral-habit-matrix (MIT licence, Yiming Zhang). -->
  <title id="title">UPbRPy Studio icon</title>
  <desc id="desc">Three time-resolved laser-ablation signals with gas blanks, sloping plateaus and washout tails, a blue integration window and an upper-right Pupin S8 zircon with a laser spot, on a gridded paper panel and softly shaded light tile.</desc>
